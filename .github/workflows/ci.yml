name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README*.md"
      - "CHANGELOG*.md"
      - "ARCHITECTURE.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README*.md"
      - "CHANGELOG*.md"
      - "ARCHITECTURE.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CONAN_HOME: ${{ github.workspace }}/.cache/conan2
  PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip

jobs:
  quality:
    name: quality (Ubuntu Clang)
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap repository-local Conan
        run: bash scripts/bootstrap.sh
      - name: Bootstrap pinned Contracts package
        run: bash scripts/bootstrap-contracts.sh
      - name: Check formatting
        run: |
          find include src tests benchmarks fuzz -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror
      - name: Configure with clang-tidy and warnings-as-errors
        run: >-
          bash scripts/configure.sh debug
          -DBMD_PROJECTION_BUILD_PROTO_ADAPTER=ON
          -DBMD_PROJECTION_ENABLE_CLANG_TIDY=ON
          -DBMD_PROJECTION_ENABLE_WERROR=ON
      - name: Build
        run: bash scripts/build.sh debug
      - name: Test
        run: bash scripts/test.sh debug
      - name: Staged install consumer
        run: bash scripts/install-consumer-test.sh

  build-matrix:
    name: release (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu GCC
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            artifact-label: ubuntu-gcc
          - name: Ubuntu Clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            artifact-label: ubuntu-clang
          - name: macOS AppleClang
            os: macos-latest
            cc: clang
            cxx: clang++
            artifact-label: macos-appleclang
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
      - name: Bootstrap repository-local Conan
        run: bash scripts/bootstrap.sh
      - name: Bootstrap pinned Contracts package
        run: bash scripts/bootstrap-contracts.sh
      - name: Configure
        run: >-
          bash scripts/configure.sh release
          -DBMD_PROJECTION_BUILD_PROTO_ADAPTER=ON
          -DBMD_PROJECTION_ENABLE_WERROR=ON
      - name: Build
        run: bash scripts/build.sh release
      - name: Test
        run: bash scripts/test.sh release
      - name: Produce semantic manifest
        run: >-
          build/release/cmake/tests/bmd_projection_m5_semantic_manifest
          --output build/release/cmake/tests/m5-semantic-manifest.json
          --head-sha ${{ github.sha }}
      - name: Upload semantic manifest
        uses: actions/upload-artifact@v4
        with:
          name: m5-semantic-manifest-${{ matrix.artifact-label }}-${{ steps.sha.outputs.short }}
          path: build/release/cmake/tests/m5-semantic-manifest.json
          retention-days: 3
      - name: Staged install consumer
        run: bash scripts/install-consumer-test.sh

  sanitizers:
    name: ${{ matrix.label }} (Ubuntu Clang)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: asan
            label: ASan
          - preset: ubsan
            label: UBSan
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap repository-local Conan
        run: bash scripts/bootstrap.sh
      - name: Bootstrap pinned Contracts package
        run: bash scripts/bootstrap-contracts.sh
      - name: Configure
        run: >-
          bash scripts/configure.sh ${{ matrix.preset }}
          -DBMD_PROJECTION_BUILD_PROTO_ADAPTER=ON
          -DBMD_PROJECTION_ENABLE_WERROR=ON
      - name: Build
        run: bash scripts/build.sh ${{ matrix.preset }}
      - name: Test
        run: bash scripts/test.sh ${{ matrix.preset }}

  benchmark-smoke:
    name: benchmark smoke (Ubuntu Clang)
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap repository-local Conan
        run: bash scripts/bootstrap.sh
      - name: Configure
        run: bash scripts/configure.sh benchmark -DBMD_PROJECTION_ENABLE_WERROR=ON
      - name: Build
        run: bash scripts/build.sh benchmark
      - name: Run infrastructure benchmark
        run: >-
          build/benchmark/cmake/benchmarks/bmd_projection_benchmarks
          --benchmark_format=json
          --benchmark_out=build/benchmark/foundation-benchmark.json

  fuzz-smoke:
    name: fuzz smoke (Ubuntu Clang)
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      BMD_PROJECTION_REQUIRE_FUZZERS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap repository-local Conan
        run: bash scripts/bootstrap.sh
      - name: Build and run all fuzz smoke targets
        run: bash scripts/fuzz-smoke.sh

  m4-static:
    name: M4 static (${{ matrix.name }}, ${{ matrix.preset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu GCC
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            preset: debug
          - name: Ubuntu GCC
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            preset: release
          - name: Ubuntu Clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            preset: debug
          - name: Ubuntu Clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            preset: release
          - name: macOS AppleClang
            os: macos-14
            cc: clang
            cxx: clang++
            preset: debug
          - name: macOS AppleClang
            os: macos-14
            cc: clang
            cxx: clang++
            preset: release
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap repository-local Conan
        run: bash scripts/bootstrap.sh
      - name: Bootstrap pinned Contracts package
        run: bash scripts/bootstrap-contracts.sh
      - name: Configure M4 static
        run: >-
          bash scripts/configure.sh ${{ matrix.preset }}
          -DBMD_PROJECTION_BUILD_PROTO_ADAPTER=ON
          -DBMD_PROJECTION_ENABLE_WERROR=ON
      - name: Build
        run: bash scripts/build.sh ${{ matrix.preset }}
      - name: Test complete M0-M4 matrix
        run: bash scripts/test.sh ${{ matrix.preset }}
      - name: ProtoAdapter installed consumer and symbol ownership
        if: matrix.preset == 'release'
        run: bash scripts/install-adapter-consumer-test.sh

  m4-shared:
    name: M4 shared (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu GCC
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: macOS AppleClang
            os: macos-14
            cc: clang
            cxx: clang++
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      BMD_PROJECTION_SHARED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap repository-local Conan
        run: bash scripts/bootstrap.sh
      - name: Bootstrap pinned Contracts package
        run: bash scripts/bootstrap-contracts.sh
      - name: Configure M4 shared
        run: >-
          bash scripts/configure.sh release
          -DBMD_PROJECTION_BUILD_PROTO_ADAPTER=ON
          -DBUILD_SHARED_LIBS=ON
          -DBMD_PROJECTION_ENABLE_WERROR=ON
      - name: Build
        run: bash scripts/build.sh release
      - name: Test
        run: bash scripts/test.sh release
      - name: Shared installed consumer and symbol ownership
        run: bash scripts/install-adapter-consumer-test.sh

  m5-replay:
    name: m5-replay (Ubuntu Clang)
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap repository-local Conan
        run: bash scripts/bootstrap.sh
      - name: Bootstrap pinned Contracts package
        run: bash scripts/bootstrap-contracts.sh
      - name: Configure Debug
        run: >-
          bash scripts/configure.sh debug
          -DBMD_PROJECTION_BUILD_PROTO_ADAPTER=ON
          -DBMD_PROJECTION_ENABLE_WERROR=ON
      - name: Build Debug
        run: bash scripts/build.sh debug
      - name: Produce Debug manifest (run 1)
        run: >-
          build/debug/cmake/tests/bmd_projection_m5_semantic_manifest
          --output build/m5-debug-1.json
          --head-sha ${{ github.sha }}
      - name: Produce Debug manifest (run 2)
        run: >-
          build/debug/cmake/tests/bmd_projection_m5_semantic_manifest
          --output build/m5-debug-2.json
          --head-sha ${{ github.sha }}
      - name: Configure Release
        run: >-
          bash scripts/configure.sh release
          -DBMD_PROJECTION_BUILD_PROTO_ADAPTER=ON
          -DBMD_PROJECTION_ENABLE_WERROR=ON
      - name: Build Release
        run: bash scripts/build.sh release
      - name: Produce Release manifest (run 1)
        run: >-
          build/release/cmake/tests/bmd_projection_m5_semantic_manifest
          --output build/m5-release-1.json
          --head-sha ${{ github.sha }}
      - name: Produce Release manifest (run 2)
        run: >-
          build/release/cmake/tests/bmd_projection_m5_semantic_manifest
          --output build/m5-release-2.json
          --head-sha ${{ github.sha }}
      - name: Verify Debug/Release determinism and run repeatability
        run: |
          python3 -c "
          import json, sys
          def load(p):
              with open(p) as f:
                  return json.load(f)
          def digests(m):
              return {w['workload_id']: w['semantic_digest'] for w in m['workloads']}
          d1 = load('build/m5-debug-1.json')
          d2 = load('build/m5-debug-2.json')
          r1 = load('build/m5-release-1.json')
          r2 = load('build/m5-release-2.json')
          assert d1['head_sha'] == d2['head_sha'] == r1['head_sha'] == r2['head_sha'], 'HEAD mismatch'
          assert digests(d1) == digests(d2), 'Debug run repeatability FAIL'
          assert digests(r1) == digests(r2), 'Release run repeatability FAIL'
          assert digests(d1) == digests(r1), 'Debug/Release semantic equality FAIL'
          assert d1['schema_version'] == d2['schema_version'] == r1['schema_version'] == r2['schema_version']
          print(f'm5-replay PASS ({len(digests(d1))} workloads, Debug==Release, repeatable)')
          for wid in digests(d1):
              print(f'  {wid}: {digests(d1)[wid]}')
          "

  m5-semantic-compare:
    name: m5-semantic-compare
    runs-on: ubuntu-latest
    needs: build-matrix
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
      - name: Download manifest (Ubuntu GCC)
        uses: actions/download-artifact@v4
        with:
          name: m5-semantic-manifest-ubuntu-gcc-${{ steps.sha.outputs.short }}
          path: manifests/ubuntu-gcc
      - name: Download manifest (Ubuntu Clang)
        uses: actions/download-artifact@v4
        with:
          name: m5-semantic-manifest-ubuntu-clang-${{ steps.sha.outputs.short }}
          path: manifests/ubuntu-clang
      - name: Download manifest (macOS AppleClang)
        uses: actions/download-artifact@v4
        with:
          name: m5-semantic-manifest-macos-appleclang-${{ steps.sha.outputs.short }}
          path: manifests/macos-appleclang
      - name: Compare semantic manifests
        id: compare
        run: |
          python3 scripts/compare-m5-semantic-manifests.py --expected-head ${{ github.sha }} \
            manifests/ubuntu-gcc/m5-semantic-manifest.json \
            manifests/ubuntu-clang/m5-semantic-manifest.json \
            manifests/macos-appleclang/m5-semantic-manifest.json \
            2>&1 | tee m5-semantic-comparison.txt
      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-semantic-comparison-${{ steps.sha.outputs.short }}
          path: m5-semantic-comparison.txt
          retention-days: 3
