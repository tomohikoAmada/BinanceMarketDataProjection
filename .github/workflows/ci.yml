name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README*.md"
      - "CHANGELOG*.md"
      - "ARCHITECTURE.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README*.md"
      - "CHANGELOG*.md"
      - "ARCHITECTURE.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CONAN_HOME: ${{ github.workspace }}/.cache/conan2
  PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
  EVIDENCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  quality:
    name: quality (canonical pinned toolchain)
    # Canonical Quality runs entirely inside the repository-pinned container
    # (see .toolchain/quality.env); the runner label therefore cannot silently
    # change the acceptance toolchain, but a concrete 24.04 label keeps the
    # Docker runtime stable.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Report canonical Quality toolchain contract
        run: cat .toolchain/quality.env
      - name: Canonical Quality (containerized pinned toolchain)
        run: bash scripts/quality.sh

  quality-toolchain-tests:
    name: quality toolchain contract tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Deterministic toolchain identity tests
        run: bash scripts/test-quality-toolchain.sh

  build-matrix:
    name: release (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu GCC
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            artifact-label: ubuntu-gcc
          - name: Ubuntu Clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            artifact-label: ubuntu-clang
          - name: macOS AppleClang
            os: macos-latest
            cc: clang
            cxx: clang++
            artifact-label: macos-appleclang
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - name: Verify checkout identity
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EVIDENCE_SHA" || {
            echo "CHECKOUT MISMATCH: expected=$EVIDENCE_SHA actual=$actual" >&2
            exit 1
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compute short evidence SHA
        id: evsha
        run: echo "short=${EVIDENCE_SHA::8}" >> $GITHUB_OUTPUT
      - name: Bootstrap repository-local Conan
        run: bash scripts/bootstrap.sh
      - name: Bootstrap pinned Contracts package
        run: bash scripts/bootstrap-contracts.sh
      - name: Configure
        run: >-
          bash scripts/configure.sh release
          -DBMD_PROJECTION_BUILD_PROTO_ADAPTER=ON
          -DBMD_PROJECTION_ENABLE_WERROR=ON
      - name: Build
        run: bash scripts/build.sh release
      - name: Test
        run: bash scripts/test.sh release
      - name: Produce semantic manifest
        run: >-
          build/release/cmake/tests/bmd_projection_m5_semantic_manifest
          --output build/release/cmake/tests/m5-semantic-manifest.json
          --head-sha ${{ env.EVIDENCE_SHA }}
      - name: Upload semantic manifest
        uses: actions/upload-artifact@v4
        with:
          name: m5-semantic-manifest-${{ matrix.artifact-label }}-${{ steps.evsha.outputs.short }}
          path: build/release/cmake/tests/m5-semantic-manifest.json
          retention-days: 3
      - name: Staged install consumer
        run: bash scripts/install-consumer-test.sh

  sanitizers:
    name: ${{ matrix.label }} (Ubuntu Clang)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: asan
            label: ASan
          - preset: ubsan
            label: UBSan
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap repository-local Conan
        run: bash scripts/bootstrap.sh
      - name: Bootstrap pinned Contracts package
        run: bash scripts/bootstrap-contracts.sh
      - name: Configure
        run: >-
          bash scripts/configure.sh ${{ matrix.preset }}
          -DBMD_PROJECTION_BUILD_PROTO_ADAPTER=ON
          -DBMD_PROJECTION_ENABLE_WERROR=ON
      - name: Build
        run: bash scripts/build.sh ${{ matrix.preset }}
      - name: Test
        run: bash scripts/test.sh ${{ matrix.preset }}

  benchmark-smoke:
    name: benchmark smoke (Ubuntu Clang)
    runs-on: ubuntu-latest
    # The pinned Contracts package is bootstrapped from source on cold CI
    # runners (fail-closed M4 inventory requires it), which alone consumes
    # ~10-15 minutes; the 15-minute recommendation is insufficient for the
    # complete Phase-6 smoke path.
    timeout-minutes: 45
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - name: Verify benchmark checkout identity
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EVIDENCE_SHA" || {
            echo "CHECKOUT MISMATCH: expected=$EVIDENCE_SHA actual=$actual" >&2
            exit 1
          }
      - name: Compute actual benchmark checkout short SHA
        id: benchmark_sha
        run: |
          actual="$(git rev-parse HEAD)"
          echo "short=${actual:0:8}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap repository-local Conan
        run: bash scripts/bootstrap.sh
      - name: Bootstrap pinned Contracts package
        run: bash scripts/bootstrap-contracts.sh
      - name: Configure
        run: >-
          bash scripts/configure.sh benchmark
          -DBMD_PROJECTION_BUILD_PROTO_ADAPTER=ON
          -DBMD_PROJECTION_ENABLE_WERROR=ON
      - name: Build
        run: bash scripts/build.sh benchmark
      - name: Run Phase-6 benchmark smoke (fail-closed, structural only)
        run: bash scripts/benchmark-smoke.sh
      - name: Validate benchmark smoke provenance and outputs
        env:
          EXPECTED_EVIDENCE_SHA: ${{ env.EVIDENCE_SHA }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          results = Path("build/benchmark/phase6-smoke-results")
          required = (
              results / "benchmarks.json",
              results / "benchmarks-wrapper.json",
              results / "latency.json",
              results / "latency-wrapper.json",
          )
          for path in required:
              if not path.is_file():
                  raise SystemExit(f"missing mandatory benchmark smoke output: {path}")

          expected_sha = os.environ["EXPECTED_EVIDENCE_SHA"]
          for name in ("benchmarks-wrapper.json", "latency-wrapper.json"):
              path = results / name
              document = json.loads(path.read_text(encoding="utf-8"))
              source = document.get("source_provenance")
              if not isinstance(source, dict):
                  raise SystemExit(f"{name}: missing source_provenance")
              if source.get("git_sha") != expected_sha:
                  raise SystemExit(
                      f"{name}: source SHA {source.get('git_sha')!r} != {expected_sha!r}"
                  )
              if source.get("status") != "known":
                  raise SystemExit(f"{name}: source provenance status is not known")
              if source.get("dirty_at_configure") is not False:
                  raise SystemExit(f"{name}: source was dirty at configure")
              if document.get("evidence_class") != "exploratory":
                  raise SystemExit(f"{name}: evidence class is not exploratory")

          print("benchmark smoke outputs and provenance PASS")
          PY
      - name: Upload benchmark smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-benchmark-smoke-ubuntu-clang-${{ steps.benchmark_sha.outputs.short }}
          path: |
            build/benchmark/phase6-smoke-results/benchmarks.json
            build/benchmark/phase6-smoke-results/benchmarks-wrapper.json
            build/benchmark/phase6-smoke-results/latency.json
            build/benchmark/phase6-smoke-results/latency-wrapper.json
          retention-days: 3
          if-no-files-found: error

  fuzz-smoke:
    name: fuzz smoke (Ubuntu Clang)
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      BMD_PROJECTION_REQUIRE_FUZZERS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap repository-local Conan
        run: bash scripts/bootstrap.sh
      - name: Build and run all fuzz smoke targets
        run: bash scripts/fuzz-smoke.sh

  m4-static:
    name: M4 static (${{ matrix.name }}, ${{ matrix.preset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu GCC
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            preset: debug
          - name: Ubuntu GCC
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            preset: release
          - name: Ubuntu Clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            preset: debug
          - name: Ubuntu Clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            preset: release
          - name: macOS AppleClang
            os: macos-14
            cc: clang
            cxx: clang++
            preset: debug
          - name: macOS AppleClang
            os: macos-14
            cc: clang
            cxx: clang++
            preset: release
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap repository-local Conan
        run: bash scripts/bootstrap.sh
      - name: Bootstrap pinned Contracts package
        run: bash scripts/bootstrap-contracts.sh
      - name: Configure M4 static
        run: >-
          bash scripts/configure.sh ${{ matrix.preset }}
          -DBMD_PROJECTION_BUILD_PROTO_ADAPTER=ON
          -DBMD_PROJECTION_ENABLE_WERROR=ON
      - name: Build
        run: bash scripts/build.sh ${{ matrix.preset }}
      - name: Test complete M0-M4 matrix
        run: bash scripts/test.sh ${{ matrix.preset }}
      - name: ProtoAdapter installed consumer and symbol ownership
        if: matrix.preset == 'release'
        run: bash scripts/install-adapter-consumer-test.sh

  m4-shared:
    name: M4 shared (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu GCC
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: macOS AppleClang
            os: macos-14
            cc: clang
            cxx: clang++
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      BMD_PROJECTION_SHARED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap repository-local Conan
        run: bash scripts/bootstrap.sh
      - name: Bootstrap pinned Contracts package
        run: bash scripts/bootstrap-contracts.sh
      - name: Configure M4 shared
        run: >-
          bash scripts/configure.sh release
          -DBMD_PROJECTION_BUILD_PROTO_ADAPTER=ON
          -DBUILD_SHARED_LIBS=ON
          -DBMD_PROJECTION_ENABLE_WERROR=ON
      - name: Build
        run: bash scripts/build.sh release
      - name: Test
        run: bash scripts/test.sh release
      - name: Shared installed consumer and symbol ownership
        run: bash scripts/install-adapter-consumer-test.sh

  m5-replay:
    name: m5-replay (Ubuntu Clang)
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - name: Verify checkout identity
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EVIDENCE_SHA" || {
            echo "CHECKOUT MISMATCH: expected=$EVIDENCE_SHA actual=$actual" >&2
            exit 1
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap repository-local Conan
        run: bash scripts/bootstrap.sh
      - name: Bootstrap pinned Contracts package
        run: bash scripts/bootstrap-contracts.sh
      - name: Configure Debug
        run: >-
          bash scripts/configure.sh debug
          -DBMD_PROJECTION_BUILD_PROTO_ADAPTER=ON
          -DBMD_PROJECTION_ENABLE_WERROR=ON
      - name: Build Debug
        run: bash scripts/build.sh debug
      - name: Produce Debug manifest (run 1)
        run: >-
          build/debug/cmake/tests/bmd_projection_m5_semantic_manifest
          --output build/m5-debug-1.json
          --head-sha ${{ env.EVIDENCE_SHA }}
      - name: Produce Debug manifest (run 2)
        run: >-
          build/debug/cmake/tests/bmd_projection_m5_semantic_manifest
          --output build/m5-debug-2.json
          --head-sha ${{ env.EVIDENCE_SHA }}
      - name: Configure Release
        run: >-
          bash scripts/configure.sh release
          -DBMD_PROJECTION_BUILD_PROTO_ADAPTER=ON
          -DBMD_PROJECTION_ENABLE_WERROR=ON
      - name: Build Release
        run: bash scripts/build.sh release
      - name: Produce Release manifest (run 1)
        run: >-
          build/release/cmake/tests/bmd_projection_m5_semantic_manifest
          --output build/m5-release-1.json
          --head-sha ${{ env.EVIDENCE_SHA }}
      - name: Produce Release manifest (run 2)
        run: >-
          build/release/cmake/tests/bmd_projection_m5_semantic_manifest
          --output build/m5-release-2.json
          --head-sha ${{ env.EVIDENCE_SHA }}
      - name: Verify Debug/Release determinism and run repeatability
        run: >-
          python3 scripts/compare-m5-semantic-manifests.py
          --mode replay
          --expected-head "${EVIDENCE_SHA}"
          build/m5-debug-1.json
          build/m5-debug-2.json
          build/m5-release-1.json
          build/m5-release-2.json

  m5-semantic-compare:
    name: m5-semantic-compare
    runs-on: ubuntu-latest
    needs: build-matrix
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - name: Verify comparator checkout identity
        run: |
          actual="$(git rev-parse HEAD)"
          echo "m5-semantic-compare checkout SHA=$actual"
          echo "m5-semantic-compare EVIDENCE_SHA=$EVIDENCE_SHA"
          test "$actual" = "$EVIDENCE_SHA" || {
            echo "CHECKOUT MISMATCH: expected=$EVIDENCE_SHA actual=$actual" >&2
            exit 1
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compute short evidence SHA
        id: evsha
        run: echo "short=${EVIDENCE_SHA::8}" >> $GITHUB_OUTPUT
      - name: Download manifest (Ubuntu GCC)
        uses: actions/download-artifact@v4
        with:
          name: m5-semantic-manifest-ubuntu-gcc-${{ steps.evsha.outputs.short }}
          path: manifests/ubuntu-gcc
      - name: Download manifest (Ubuntu Clang)
        uses: actions/download-artifact@v4
        with:
          name: m5-semantic-manifest-ubuntu-clang-${{ steps.evsha.outputs.short }}
          path: manifests/ubuntu-clang
      - name: Download manifest (macOS AppleClang)
        uses: actions/download-artifact@v4
        with:
          name: m5-semantic-manifest-macos-appleclang-${{ steps.evsha.outputs.short }}
          path: manifests/macos-appleclang
      - name: Compare semantic manifests
        id: compare
        env:
          PRODUCER_RESULT: ${{ needs.build-matrix.result }}
        run: |
          if [ "$PRODUCER_RESULT" != "success" ]; then
            echo "FAIL: semantic producer aggregate result is $PRODUCER_RESULT" \
              | tee m5-semantic-comparison.txt
            exit 1
          fi
          set -o pipefail
          python3 scripts/compare-m5-semantic-manifests.py \
            --mode cross-compiler \
            --expected-head "${EVIDENCE_SHA}" \
            manifests/ubuntu-gcc/m5-semantic-manifest.json \
            manifests/ubuntu-clang/m5-semantic-manifest.json \
            manifests/macos-appleclang/m5-semantic-manifest.json \
            2>&1 | tee m5-semantic-comparison.txt
      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-semantic-comparison-${{ steps.evsha.outputs.short }}
          path: m5-semantic-comparison.txt
          retention-days: 3
      - name: Enforce semantic producer success
        if: always()
        env:
          PRODUCER_RESULT: ${{ needs.build-matrix.result }}
        run: |
          echo "build-matrix aggregate result=$PRODUCER_RESULT"
          test "$PRODUCER_RESULT" = "success" || {
            echo "FAIL: semantic producer aggregate result is $PRODUCER_RESULT" >&2
            exit 1
          }
